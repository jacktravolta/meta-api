# Rotacion de contexto. El presupuesto es una ESTIMACION en caracteres: Meta no
# expone contador de tokens. 150k permite ~30-40 intercambios antes de resumir,
# que es el punto donde el modelo empieza a alucinar por contexto saturado.
[Service]
Environment=META_CONTEXT_BUDGET_CHARS=150000
Environment=META_CONTEXT_SOFT_PCT=70
Environment=META_CONTEXT_SEED_CHARS=25000
# Backstop real: a ~3k chars por turno, 60 turnos = 180k > 105k del umbral, o sea
# el porcentaje es el que manda en operacion normal.
Environment=META_RESET_TURNS=60
Environment=META_RECOVERY_MAX_AGE_MS=1800000
