# Chrome con VENTANA, no oculto.
#
# server.mjs:89 — META_VISIBLE=1 abre un Chrome visible; por defecto corre
# hidden. Se usa para ver trabajar al agente en vivo (el tipeo humano, el DOM
# cambiando) en vez de mirar el journal y creerle.
#
# Costo: una ventana de Chrome en pantalla. Si molesta, se borra este archivo
# (o se pone =0) y vuelve al modo oculto sin tocar nada mas.
[Service]
Environment=META_VISIBLE=1
