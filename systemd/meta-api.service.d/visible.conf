# Modo VISIBLE: Chrome con ventana real en el escritorio (:0.0).
# El cierre por inactividad NO se overridea aqui: vive en la unit principal
# (META_IDLE_CLOSE_MS=120000 = 2 min).
# Volver a headless:
#   rm ~/.config/systemd/user/meta-api.service.d/visible.conf
#   systemctl --user daemon-reload && systemctl --user restart meta-api
[Service]
Environment=META_VISIBLE=1
Environment=DISPLAY=:0.0
Environment=XAUTHORITY=/run/user/1000/gdm/Xauthority