# TEMPORAL - solo durante la medicion de contexto. Lo quita /tmp/opencode/vigila-medicion.sh
#
# META_IDLE_CLOSE_MS=0        el autocierre dispara en los huecos entre requests,
#                             recicla los workers y resetea ctxChars al seed
# META_CONTEXT_BUDGET_CHARS=2000000  hay que ver donde Meta se degrada; con el
#                             presupuesto normal el broker rota a 105.000 y oculta
#                             justo lo que medimos
# META_RESET_TURNS=9999       idem, por el backstop de turnos
# META_JOB_TIMEOUT_MS=600000  las respuestas largas necesitan mas que los 5 min por defecto
[Service]
Environment=META_IDLE_CLOSE_MS=0
Environment=META_CONTEXT_BUDGET_CHARS=2000000
Environment=META_RESET_TURNS=9999
Environment=META_JOB_TIMEOUT_MS=600000
